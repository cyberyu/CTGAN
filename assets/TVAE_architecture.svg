<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Definitions for clean look -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="dropShadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">TVAE Architecture</text>

  <!-- Input Section -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="300" height="50" rx="5" fill="#ecf0f1" stroke="#34495e" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Input: Real Tabular Data</text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">(Mixed: Continuous + Categorical)</text>
  </g>

  <line x1="400" y1="110" x2="400" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Preprocessing -->
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="300" height="60" rx="5" fill="#d5dbdb" stroke="#34495e" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">DataTransformer</text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Normalize (Cont) | One-hot (Cat)</text>
  </g>

  <line x1="400" y1="200" x2="400" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Training Phase Container -->
  <rect x="50" y="230" width="700" height="520" rx="10" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">TRAINING PHASE</text>

  <!-- Encoder -->
  <g transform="translate(300, 270)">
    <rect x="0" y="0" width="200" height="80" rx="5" fill="#aed6f1" stroke="#2980b9" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#154360">ENCODER</text>
    <line x1="10" y1="35" x2="190" y2="35" stroke="#154360" stroke-width="1"/>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Hidden Layers 1 &amp; 2</text>
  </g>

  <!-- Split into Mu, LogVar, Std -->
  <line x1="400" y1="350" x2="300" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="350" x2="400" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="350" x2="500" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g transform="translate(250, 380)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#fff" stroke="#2980b9" stroke-width="1"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Mean (μ)</text>
  </g>
  <g transform="translate(350, 380)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#fff" stroke="#2980b9" stroke-width="1"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Log-Var (σ²)</text>
  </g>
  <g transform="translate(450, 380)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#fff" stroke="#2980b9" stroke-width="1"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Std Dev</text>
  </g>

  <!-- Reparameterization -->
  <line x1="300" y1="410" x2="400" y2="440" stroke="#333" stroke-width="1.5"/>
  <line x1="400" y1="410" x2="400" y2="440" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="410" x2="400" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g transform="translate(250, 440)">
    <rect x="0" y="0" width="300" height="40" rx="5" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
    <text x="150" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a235a">Reparameterization Trick</text>
    <text x="150" y="32" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#2c3e50">z = μ + ε * σ</text>
  </g>

  <line x1="400" y1="480" x2="400" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decoder -->
  <g transform="translate(300, 510)">
    <rect x="0" y="0" width="200" height="80" rx="5" fill="#d2b4de" stroke="#8e44ad" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a235a">DECODER</text>
    <line x1="10" y1="35" x2="190" y2="35" stroke="#4a235a" stroke-width="1"/>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Hidden Layers 1 &amp; 2</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Output Layer + Sigma</text>
  </g>

  <line x1="400" y1="590" x2="400" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Loss -->
  <g transform="translate(250, 620)">
    <rect x="0" y="0" width="300" height="60" rx="5" fill="#fdebd0" stroke="#d35400" stroke-width="2"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6e2c00">Total Loss</text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6e2c00">Reconstruction Loss + KL Divergence</text>
  </g>

  <!-- Sampling Phase Container -->
  <rect x="50" y="770" width="700" height="180" rx="10" fill="#f2f3f4" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="795" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">SAMPLING PHASE</text>

  <g transform="translate(300, 810)">
    <rect x="0" y="0" width="200" height="30" rx="5" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Random Latent Vector z ~ N(0,I)</text>
  </g>

  <line x1="400" y1="840" x2="400" y2="860" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <g transform="translate(325, 860)">
    <rect x="0" y="0" width="150" height="40" rx="5" fill="#d2b4de" stroke="#8e44ad" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a235a">Trained Decoder</text>
  </g>

  <line x1="400" y1="900" x2="400" y2="920" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <g transform="translate(250, 920)">
    <rect x="0" y="0" width="300" height="30" rx="5" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">OUTPUT: Synthetic Data</text>
  </g>

</svg>